[project]
name = "spotify-playlist-builder"
version = "0.1.0"
description = "Build Spotify playlists from an exact list of tracks (CLI + MCP connector)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
spotify-playlist = "spotify_playlist_builder.cli:main"
spotify-playlist-mcp = "spotify_playlist_builder.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
